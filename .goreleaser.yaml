version: 2

project_name: idrive-gateway

before:
  hooks:
    - go mod download

builds:
  - id: idrive-gateway
    main: ./cmd/idrive-gateway
    binary: idrive-gateway
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{- if eq .Os "darwin" }}macOS{{- else }}{{ .Os }}{{- end }}_{{ .Arch }}_headless
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums-headless.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^Merge pull request"
      - "^Merge branch"

release:
  prerelease: auto
  footer: |
    Notes:
    - `_headless` archives are portable binaries built with `CGO_ENABLED=0`; they do not include the embedded `login` webview flow.
    - `_native` archives and Windows setup installers are uploaded by GitHub Actions from CGO-enabled builds and include `login` support on supported platforms.
    - macOS native artifacts are unsigned and should be treated as experimental until validated on more real machines.
