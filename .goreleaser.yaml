version: 2

project_name: idrive-gateway

before:
  hooks:
    - go mod download

builds:
  - id: idrive-gateway
    main: ./cmd/idrive-gateway
    binary: idrive-gateway
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{- if eq .Os "darwin" }}macOS{{- else }}{{ .Os }}{{- end }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^Merge pull request"
      - "^Merge branch"

release:
  prerelease: auto
  footer: |
    Notes:
    - GoReleaser publishes portable headless binaries with `CGO_ENABLED=0`.
    - The embedded `login` webview flow is validated in CI via native CGO builds on Windows, Linux, and macOS, but release artifacts themselves are built headless for portability.
