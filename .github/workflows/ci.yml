name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - chore/**
      - feat/**
      - fix/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-vet:
    name: Format and Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build headless binary
        run: go build -o idrive-gateway ./cmd/idrive-gateway

      - name: Show version
        shell: bash
        run: ./idrive-gateway version || ./idrive-gateway.exe version

  native-linux:
    name: Native Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build CGO binary
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          go build -o dist/idrive-gateway ./cmd/idrive-gateway
          ./dist/idrive-gateway version

  native-macos:
    name: Native Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CGO binary
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          go build -o dist/idrive-gateway ./cmd/idrive-gateway
          ./dist/idrive-gateway version

  native-windows:
    name: Native Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain

      - name: Add UCRT64 toolchain to PATH
        shell: powershell
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build CGO binary
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:CC = "gcc"
          $env:CXX = "g++"
          $env:CGO_ENABLED = "1"
          go build -o .\dist\idrive-gateway.exe .\cmd\idrive-gateway
          Copy-Item C:\msys64\ucrt64\bin\libstdc++-6.dll .\dist\
          Copy-Item C:\msys64\ucrt64\bin\libgcc_s_seh-1.dll .\dist\
          Copy-Item C:\msys64\ucrt64\bin\libwinpthread-1.dll .\dist\
          .\dist\idrive-gateway.exe version

  goreleaser-snapshot:
    name: GoReleaser Snapshot
    runs-on: ubuntu-latest
    needs:
      - format-and-vet
      - unit-tests
      - native-linux
      - native-macos
      - native-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Run snapshot release
        run: goreleaser release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-snapshot
          path: dist/*
