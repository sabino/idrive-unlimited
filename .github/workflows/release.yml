name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-package-linux:
    name: Native Package (Linux amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build native package
        shell: bash
        run: |
          build_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          bash ./scripts/package-native-posix.sh \
            --version "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --build-date "${build_date}" \
            --artifact-dir "./dist-native" \
            --os-label "linux" \
            --arch-label "amd64"

      - name: Smoke test packaged binary
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p smoke
          tar -C smoke -xzf "dist-native/idrive-gateway_${version}_linux_amd64_native.tar.gz"
          ./smoke/idrive-gateway_${version}_linux_amd64_native/idrive-gateway version

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-linux-amd64
          path: dist-native/*_linux_amd64_native.tar.gz

  native-package-macos:
    name: Native Package (macOS ${{ matrix.arch_label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch_label: amd64
          - runner: macos-14
            arch_label: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build native package
        shell: bash
        run: |
          build_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          bash ./scripts/package-native-posix.sh \
            --version "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --build-date "${build_date}" \
            --artifact-dir "./dist-native" \
            --os-label "macOS" \
            --arch-label "${{ matrix.arch_label }}"

      - name: Smoke test packaged binary
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p smoke
          tar -C smoke -xzf "dist-native/idrive-gateway_${version}_macOS_${{ matrix.arch_label }}_native.tar.gz"
          ./smoke/idrive-gateway_${version}_macOS_${{ matrix.arch_label }}_native/idrive-gateway version

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-macos-${{ matrix.arch_label }}
          path: dist-native/*_macOS_${{ matrix.arch_label }}_native.tar.gz

  native-package-windows:
    name: Native Package (Windows amd64)
    runs-on: windows-latest
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up MSYS2 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain

      - name: Add UCRT64 toolchain to PATH
        shell: powershell
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build native package
        shell: powershell
        run: |
          $buildDate = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          powershell -ExecutionPolicy Bypass -File .\scripts\package-windows-native.ps1 `
            -Version "${env:GITHUB_REF_NAME}" `
            -Commit "${env:GITHUB_SHA}" `
            -BuildDate $buildDate `
            -ArtifactDir ".\dist-native" `
            -ToolchainBin "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" `
            -RequireInstaller

      - name: Smoke test packaged zip
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $zipPath = ".\dist-native\idrive-gateway_${version}_windows_amd64_native.zip"
          $extractDir = ".\smoke-zip"
          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          Expand-Archive -Path $zipPath -DestinationPath $extractDir
          .\smoke-zip\idrive-gateway_${version}_windows_amd64_native\idrive-gateway.exe version

      - name: Smoke test installer
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $installer = ".\dist-native\idrive-gateway-setup_${version}_windows_amd64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "idrive-gateway-install"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$installDir" -Wait
          & (Join-Path $installDir "idrive-gateway.exe") version

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-windows-amd64
          path: |
            dist-native/*_windows_amd64_native.zip
            dist-native/idrive-gateway-setup_*_windows_amd64.exe

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - native-package-linux
      - native-package-macos
      - native-package-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native-dist
          merge-multiple: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write native checksums
        shell: bash
        run: |
          mapfile -t files < <(find native-dist -maxdepth 1 -type f \( -name '*_native.tar.gz' -o -name '*_native.zip' -o -name 'idrive-gateway-setup_*.exe' \) | sort)
          bash ./scripts/write-checksums.sh native-dist/checksums-native.txt "${files[@]}"

      - name: Upload native assets to release
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" native-dist/*_native.tar.gz native-dist/*_native.zip native-dist/idrive-gateway-setup_*.exe native-dist/checksums-native.txt --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
